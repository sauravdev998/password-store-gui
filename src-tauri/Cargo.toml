[package]
name = "password-store-gui"
version = "0.1.0"
description = "A cross-platform GUI client for the pass password manager"
authors = ["Saurav Mohanta"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
# Floor set by prs-lib 0.5.7 (edition 2024, rust-version 1.88.0). See ADR-4.
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "password_store_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
prs-lib = "0.5.7"
thiserror = "2"
dirs = "6"
secrecy = "0.10"
zeroize = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
totp-rs = { version = "5.7.2", default-features = false, features = ["otpauth", "zeroize"] }
# The write path (ADR-6): `which` locates the same `gpg` prs-lib's context does,
# and `tempfile` makes a ciphertext write atomic.
which = "8"
tempfile = "3"
# Local git only, which is why the network features are off: `default-features`
# pulls in libssh2 and OpenSSL for fetch/push, and Open Decision 2 leans to
# shelling out to the user's `git` for network operations so their credential
# helpers keep working. Phase 4 revisits that; a commit needs none of it.
git2 = { version = "0.21", default-features = false }
# OS entropy for `generate`, taken directly rather than through a seeded
# generator. Already in the tree transitively, so it costs no build time.
getrandom = "0.3"
# `std::fs::canonicalize` returns a `\\?\` verbatim path on Windows, which we
# then hand to `gpg` as an argument. See `store::prs::PrsStore::open`. No
# dependencies of its own, and a plain re-export of `std` off Windows.
dunce = "1"

[lints.rust]
unsafe_code = "forbid"

# Secrets must not survive in freed memory or leak through a panic message.
# See PLAN.md §4; these are enforced in CI via `cargo clippy -- -D warnings`.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
# `tempfile` and `which` are regular dependencies as of ADR-6; the integration
# tests use them too, which needs no entry of its own.
