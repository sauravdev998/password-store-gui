name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      # The gpg.exe bundled with Git for Windows is an MSYS2 build: it reads
      # GNUPGHOME as an MSYS path, so the native temp dir the test fixture sets
      # is treated as relative and joined onto gpg's cwd. Stage a native GnuPG
      # and put it first on PATH — also the configuration Windows users
      # actually have.
      #
      # This is `scripts/fetch-gnupg.sh`, the same script that stages the tree
      # ADR-14 bundles, so the version and its checksum live in one place and
      # the tests run against the binary the app will ship. It unpacks rather
      # than installing: running the GnuPG installer on a hosted runner hangs
      # the step until it times out, whether launched by `choco install gnupg`
      # or directly with NSIS `/S`.
      - name: Stage a native GnuPG
        if: matrix.platform == 'windows-latest'
        shell: bash
        timeout-minutes: 5
        run: |
          ./scripts/fetch-gnupg.sh
          staged="$(pwd)/src-tauri/gnupg/bin"
          # Proves the extracted tree is usable, not merely present.
          "${staged}/gpg.exe" --version
          # GITHUB_PATH prepends, so this wins over Git for Windows' gpg — but
          # only if Windows can read the entry. `pwd` in this shell is an MSYS
          # path (`/d/a/...`), which native PATH lookup ignores *in silence*,
          # putting the MSYS gpg.exe back in front. `cygpath -w` is what makes
          # the entry a path the test binaries will actually search.
          cygpath -w "${staged}" >>"$GITHUB_PATH"

      # GITHUB_PATH only takes effect in later steps, so this is the earliest
      # place the ordering can be checked — and it is worth a step of its own,
      # because getting it wrong fails nowhere near here: the MSYS gpg then
      # wins and dies mid-suite on a keyring path it built by joining
      # GNUPGHOME onto its cwd.
      - name: Check which gpg the tests will find
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $gpg = (Get-Command gpg.exe -ErrorAction SilentlyContinue).Source
          Write-Host "gpg.exe -> $gpg"
          if ($gpg -notlike '*\src-tauri\gnupg\bin\gpg.exe') {
            throw "expected the staged GnuPG first on PATH, found '$gpg'"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the frontend bundle to exist.
      - run: pnpm build

      - name: Format
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test
        working-directory: src-tauri

  bundle:
    # Proves the app actually packages on each OS. Kept separate so a failure
    # here is distinguishable from a code failure above.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ADR-14. A no-op on Linux, which is not bundled for, and currently a
      # no-op on macOS too — the script refuses rather than producing a bundle
      # with no GnuPG in it, so `continue-on-error` is what keeps that refusal
      # informative instead of red.
      - name: Stage the bundled GnuPG
        shell: bash
        continue-on-error: ${{ matrix.platform == 'macos-latest' }}
        run: ./scripts/fetch-gnupg.sh

      - run: pnpm tauri build
