name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      # ADR-14's tree, cached because macOS builds it from source and that is
      # minutes rather than seconds. Keyed on the script, which holds every
      # pinned version and checksum, so a bump misses the cache by construction.
      - name: Cache the bundled GnuPG
        if: matrix.platform != 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: src-tauri/gnupg
          key: gnupg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-gnupg.sh') }}

      # The gpg.exe bundled with Git for Windows is an MSYS2 build: it reads
      # GNUPGHOME as an MSYS path, so the native temp dir the test fixture sets
      # is treated as relative and joined onto gpg's cwd. Stage a native GnuPG
      # and put it first on PATH — also the configuration Windows users
      # actually have.
      #
      # This is `scripts/fetch-gnupg.sh`, the same script that stages the tree
      # ADR-14 bundles, so the version and its checksum live in one place and
      # the tests run against the binary the app will ship. It unpacks rather
      # than installing: running the GnuPG installer on a hosted runner hangs
      # the step until it times out, whether launched by `choco install gnupg`
      # or directly with NSIS `/S`.
      - name: Stage a native GnuPG
        if: matrix.platform == 'windows-latest'
        shell: bash
        timeout-minutes: 5
        run: |
          ./scripts/fetch-gnupg.sh
          staged="$(pwd)/src-tauri/gnupg/bin"
          # Proves the extracted tree is usable, not merely present.
          "${staged}/gpg.exe" --version
          # GITHUB_PATH prepends, so this wins over Git for Windows' gpg — but
          # only if Windows can read the entry. `pwd` in this shell is an MSYS
          # path (`/d/a/...`), which native PATH lookup ignores *in silence*,
          # putting the MSYS gpg.exe back in front. `cygpath -w` is what makes
          # the entry a path the test binaries will actually search.
          cygpath -w "${staged}" >>"$GITHUB_PATH"

      # macOS builds its bundle from source (ADR-14), and unlike Windows the
      # staged tree is deliberately **not** put on PATH. `tests/gpg_bundled.rs`
      # is the one unattended check that a relocated GnuPG actually works, and
      # it only means something if the `gpg` the fixture uses is a different,
      # system one — so the next step makes sure there is one.
      - name: Stage the bundled GnuPG
        if: matrix.platform == 'macos-latest'
        timeout-minutes: 40
        run: |
          ./scripts/fetch-gnupg.sh
          staged="$(pwd)/src-tauri/gnupg"
          # Runs at all: the right architecture, and no dylib it cannot find.
          "${staged}/bin/gpg" --version
          # Knows where it is. `--list-dirs` is the cheapest way to read back
          # what bin/gpgconf.ctl did, and it is worth checking here rather than
          # only through the test suite: a tree that fails this looks fine until
          # the moment it needs gpg-agent.
          bindir="$(PASSWORD_STORE_GUI_GNUPG_ROOT="${staged}" \
            "${staged}/bin/gpgconf" --list-dirs bindir)"
          if [ "${bindir}" != "${staged}/bin" ]; then
            echo "gpgconf.ctl did not relocate the tree: got '${bindir}'" >&2
            exit 1
          fi

      - name: Ensure a system GnuPG on macOS
        if: matrix.platform == 'macos-latest'
        run: command -v gpg || brew install gnupg

      # GITHUB_PATH only takes effect in later steps, so this is the earliest
      # place the ordering can be checked — and it is worth a step of its own,
      # because getting it wrong fails nowhere near here: the MSYS gpg then
      # wins and dies mid-suite on a keyring path it built by joining
      # GNUPGHOME onto its cwd.
      - name: Check which gpg the tests will find
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $gpg = (Get-Command gpg.exe -ErrorAction SilentlyContinue).Source
          Write-Host "gpg.exe -> $gpg"
          if ($gpg -notlike '*\src-tauri\gnupg\bin\gpg.exe') {
            throw "expected the staged GnuPG first on PATH, found '$gpg'"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the frontend bundle to exist.
      - run: pnpm build

      - name: Format
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test
        working-directory: src-tauri

  bundle:
    # Proves the app actually packages on each OS. Kept separate so a failure
    # here is distinguishable from a code failure above.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache the bundled GnuPG
        if: matrix.platform != 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: src-tauri/gnupg
          key: gnupg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-gnupg.sh') }}

      # ADR-14. A no-op on Linux, which is not bundled for; an unpack on
      # Windows; a source build on macOS, which is why the timeout is generous.
      - name: Stage the bundled GnuPG
        shell: bash
        timeout-minutes: 40
        run: ./scripts/fetch-gnupg.sh

      - run: pnpm tauri build

      # The bundler copies resources with `fs::copy`, which keeps the mode on
      # Unix — but a bundle whose `gpg` arrived without its executable bit, or
      # without the pinentry beside it, would still package cleanly and then be
      # useless. Cheap to check, and it fails here rather than on a user's Mac.
      - name: Check the bundled GnuPG survived packaging
        if: matrix.platform == 'macos-latest'
        run: |
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          [ -n "${app}" ] || { echo 'no .app was produced' >&2; exit 1; }
          root="${app}/Contents/Resources/gnupg"
          for required in \
            bin/gpg bin/gpg-agent bin/gpgconf bin/gpgconf.ctl bin/pinentry \
            libexec/pinentry-mac.app/Contents/MacOS/pinentry-mac
          do
            [ -e "${root}/${required}" ] || { echo "missing ${required}" >&2; exit 1; }
          done
          for executable in bin/gpg bin/gpg-agent bin/pinentry \
            libexec/pinentry-mac.app/Contents/MacOS/pinentry-mac
          do
            [ -x "${root}/${executable}" ] || { echo "${executable} is not executable" >&2; exit 1; }
          done
