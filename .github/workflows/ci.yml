name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      # The gpg.exe bundled with Git for Windows is an MSYS2 build: it reads
      # GNUPGHOME as an MSYS path, so the native temp dir the test fixture sets
      # is treated as relative and joined onto gpg's cwd. Install a native
      # GnuPG and put it first on PATH — also the configuration Windows users
      # actually have.
      #
      # Unpacked rather than installed. Running the GnuPG installer on a hosted
      # runner hangs the step until it times out, whether it is launched by
      # `choco install gnupg` or directly with NSIS `/S` — nothing is printed
      # and nothing exits. The installer is an NSIS archive, so 7-Zip (already
      # on the image) can extract the tree without executing anything. GnuPG
      # finds its own root relative to the running .exe, so an extracted
      # bin/ + share/ works exactly like an installed one.
      #
      # The checksum is the one published on gnupg.org/download/integrity_check.
      - name: Install a native GnuPG
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $url = 'https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.21_20260702.exe'
          $want = '6246c925a73167253444afc24a0deb83a3f43b7d636af84d6aaf48a98a62f024'
          $exe = Join-Path $env:RUNNER_TEMP 'gnupg-w32.exe'

          # curl.exe over Invoke-WebRequest: it is preinstalled, faster, and
          # --max-time bounds a stalled transfer instead of hanging the step.
          Write-Host "Downloading $url"
          curl.exe -fsSL --retry 3 --max-time 180 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw "download failed: curl exit $LASTEXITCODE" }

          $got = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "gnupg installer checksum mismatch: $got" }

          Write-Host 'Extracting bin and share'
          7z x $exe '-oC:\gnupg' 'bin\*' 'share\*' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "extraction failed: 7z exit $LASTEXITCODE" }
          if (-not (Test-Path 'C:\gnupg\bin\gpg.exe')) { throw 'no gpg.exe in the extracted tree' }

          # Proves the extracted tree is usable, not merely present.
          & 'C:\gnupg\bin\gpg.exe' --version
          if ($LASTEXITCODE -ne 0) { throw "extracted gpg is not runnable: exit $LASTEXITCODE" }

          # GITHUB_PATH prepends, so this wins over Git for Windows' gpg.
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\gnupg\bin' -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the frontend bundle to exist.
      - run: pnpm build

      - name: Format
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test
        working-directory: src-tauri

  bundle:
    # Proves the app actually packages on each OS. Kept separate so a failure
    # here is distinguishable from a code failure above.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
